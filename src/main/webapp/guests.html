<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гостей Тойына | Административная панель</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1a1a1a;
            --accent-gold: #D4AF37;
            --accent-red: #8B0000;
            --light-bg: #F8F6F1;
            --white: #FFFFFF;
            --text-dark: #2a2a2a;
            --text-light: #555555;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(180deg, #FAFAF8 0%, #F5F0E8 50%, #FCF9F4 100%);
            color: var(--text-dark);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            margin-bottom: 30px;
            border-bottom: 3px solid var(--accent-gold);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--accent-red);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--accent-gold);
            letter-spacing: 2px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.6) 0%, rgba(250, 248, 245, 0.8) 100%);
            padding: 20px;
            border-radius: 10px;
            border: 2px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--accent-red);
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--accent-red) 0%, rgba(139, 0, 0, 0.9) 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(139, 0, 0, 0.3);
        }

        button.secondary {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2) 0%, rgba(212, 175, 55, 0.1) 100%);
            color: var(--accent-red);
            border: 2px solid var(--accent-gold);
        }

        button.secondary:hover {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.3) 0%, rgba(212, 175, 55, 0.2) 100%);
        }

        .table-wrapper {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            margin-bottom: 40px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: linear-gradient(135deg, var(--accent-red) 0%, rgba(139, 0, 0, 0.9) 100%);
            color: white;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        tbody tr:hover {
            background: #f9f7f0;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-yes {
            background: #d4edda;
            color: #155724;
        }

        .status-no {
            background: #f8d7da;
            color: #721c24;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.85rem;
            border-radius: 5px;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-edit {
            background: var(--accent-gold);
            color: var(--text-dark);
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: var(--text-light);
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            background: transparent;
            border: 2px solid var(--accent-gold);
            color: var(--accent-red);
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .filter-btn.active {
            background: var(--accent-gold);
            color: var(--text-dark);
        }

        .export-section {
            text-align: center;
            padding: 20px;
            background: rgba(212, 175, 55, 0.1);
            border-radius: 10px;
            margin-top: 30px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: #fefef2;
            margin: 5% auto;
            padding: 30px;
            border: 2px solid var(--accent-gold);
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .close {
            color: var(--text-light);
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: var(--accent-red);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--accent-red);
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
        }

        @media (max-width: 768px) {
            h1 { font-size: 1.8rem; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            table { font-size: 0.9rem; }
            th, td { padding: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 Қыз ұзату - Гостей панель</h1>
            <p class="subtitle">Назымның ұзату тойына қонақтар</p>
        </header>

        <!-- Статистика -->
        <div class="stats-grid" id="statsContainer">
            <div class="stat-card">
                <div class="stat-number" id="totalGuests">0</div>
                <div class="stat-label">Барлығы</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="confirmedGuests">0</div>
                <div class="stat-label">Келмек</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="declinedGuests">0</div>
                <div class="stat-label">Келмемек</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="pendingGuests">0</div>
                <div class="stat-label">Біліпеңіз</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalCount">0</div>
                <div class="stat-label">Барлық адам</div>
            </div>
        </div>

        <!-- Фильтры и управление -->
        <div class="controls">
            <button onclick="loadAllGuests()" title="Барлық гостей"><i class="fas fa-list"></i> Барлығы</button>
            <button class="secondary" onclick="exportToCSV()" title="CSV экспорт"><i class="fas fa-download"></i> CSV экспорт</button>
            <button class="secondary" onclick="refreshData()" title="Обновить"><i class="fas fa-sync"></i> Обновить</button>
        </div>

        <div class="filter-buttons">
            <button class="filter-btn active" onclick="filterGuests('all')">Барлығы</button>
            <button class="filter-btn" onclick="filterGuests('yes')">Келмек</button>
            <button class="filter-btn" onclick="filterGuests('no')">Келмемек</button>
            <button class="filter-btn" onclick="filterGuests('pending')">Біліпеңіз</button>
        </div>

        <!-- Таблица гостей -->
        <div class="table-wrapper">
            <div id="loadingMessage" class="loading">
                <i class="fas fa-spinner fa-spin"></i> Гостей жүктеліп жатыр...
            </div>
            <table id="guestsTable" style="display: none;">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Аты</th>
                        <th>Қонақ саны</th>
                        <th>Жұбайы</th>
                        <th>Статусы</th>
                        <th>Уақыты</th>
                        <th>Әрекеттер</th>
                    </tr>
                </thead>
                <tbody id="guestsList">
                </tbody>
            </table>
        </div>

        <!-- Экспорт -->
        <div class="export-section">
            <h3>📊 Деректерді экспорт</h3>
            <p style="margin-bottom: 15px;">Жүктеледі CSV файлы түрінде</p>
            <button onclick="exportToCSV()"><i class="fas fa-download"></i> CSV жүктеу</button>
            <button class="secondary" onclick="printList()"><i class="fas fa-print"></i> Баспасынан шығару</button>
        </div>
    </div>

    <!-- Модальное окно редактирования -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2>Гостень өңдеу</h2>
            <form id="editForm">
                <div class="form-group">
                    <label for="editName">Аты:</label>
                    <input type="text" id="editName" required>
                </div>
                <div class="form-group">
                    <label for="editCount">Қонақ саны:</label>
                    <input type="number" id="editCount" min="1" value="1">
                </div>
                <div class="form-group">
                    <label for="editSpouse">Жұбайымен:</label>
                    <select id="editSpouse">
                        <option value="Жоқ">Жоқ</option>
                        <option value="Иә">Иә</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="editAttendance">Статусы:</label>
                    <select id="editAttendance">
                        <option value="yes">Келемін</option>
                        <option value="no">Келе алмаймын</option>
                        <option value="pending">Біліпеңіз</option>
                    </select>
                </div>
                <button type="submit">Сақтау</button>
            </form>
        </div>
    </div>

    <script>
        let currentEditId = null;
        let currentFilter = 'all';

        // Загрузка всех гостей при открытии
        document.addEventListener('DOMContentLoaded', () => {
            loadAllGuests();
            setInterval(refreshData, 30000); // Обновлять каждые 30 секунд
        });

        // Загрузить всех гостей
        async function loadAllGuests() {
            try {
                const response = await fetch('/Nazym_kyzuzatu-1.0-SNAPSHOT/api/guests');
                const guests = await response.json();
                displayGuests(guests);
                updateStatistics();
            } catch (error) {
                console.error('Ошибка:', error);
                document.getElementById('loadingMessage').textContent = 'Ошибка при загрузке гостей';
            }
        }

        // Фильтровать гостей
        async function filterGuests(status) {
            // Обновляем активную кнопку фильтра
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            currentFilter = status;

            if (status === 'all') {
                await loadAllGuests();
            } else {
                try {
                    const response = await fetch(`/Nazym_kyzuzatu-1.0-SNAPSHOT/api/guests/attendance/${status}`);
                    const guests = await response.json();
                    displayGuests(guests);
                } catch (error) {
                    console.error('Ошибка:', error);
                }
            }
        }

        // Отобразить гостей в таблице
        function displayGuests(guests) {
            const tbody = document.getElementById('guestsList');
            tbody.innerHTML = '';

            if (guests.length === 0) {
                document.getElementById('loadingMessage').textContent = 'Гостей нет';
                document.getElementById('guestsTable').style.display = 'none';
                return;
            }

            guests.forEach((guest, index) => {
                const row = document.createElement('tr');
                const statusBadge = getStatusBadge(guest.attendance);
                const submittedAt = new Date(guest.submittedAt).toLocaleString();

                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td><strong>${guest.name}</strong></td>
                    <td>${guest.guestCount}</td>
                    <td>${guest.spouse}</td>
                    <td>${statusBadge}</td>
                    <td>${submittedAt}</td>
                    <td class="action-buttons">
                        <button class="btn-small btn-edit" onclick="editGuest(${guest.guestId})">
                            <i class="fas fa-edit"></i> Өңдеу
                        </button>
                        <button class="btn-small btn-delete" onclick="deleteGuest(${guest.guestId})">
                            <i class="fas fa-trash"></i> Өшіру
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });

            document.getElementById('loadingMessage').style.display = 'none';
            document.getElementById('guestsTable').style.display = 'table';
        }

        // Получить статус бейдж
        function getStatusBadge(status) {
            const statuses = {
                'yes': { class: 'status-yes', text: 'Келемін' },
                'no': { class: 'status-no', text: 'Келе алмаймын' },
                'pending': { class: 'status-pending', text: 'Біліпеңіз' }
            };

            const s = statuses[status] || statuses['pending'];
            return `<span class="status-badge ${s.class}">${s.text}</span>`;
        }

        // Редактировать гостя
        async function editGuest(guestId) {
            try {
                const response = await fetch(`/Nazym_kyzuzatu-1.0-SNAPSHOT/api/guests/${guestId}`);
                const guest = await response.json();

                document.getElementById('editName').value = guest.name;
                document.getElementById('editCount').value = guest.guestCount;
                document.getElementById('editSpouse').value = guest.spouse;
                document.getElementById('editAttendance').value = guest.attendance;

                currentEditId = guestId;
                document.getElementById('editModal').style.display = 'block';
            } catch (error) {
                console.error('Ошибка:', error);
            }
        }

        // Сохранить редактирование
        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const updatedGuest = {
                guestId: currentEditId,
                name: document.getElementById('editName').value,
                guestCount: parseInt(document.getElementById('editCount').value),
                spouse: document.getElementById('editSpouse').value,
                attendance: document.getElementById('editAttendance').value
            };

            try {
                const response = await fetch(`/Nazym_kyzuzatu-1.0-SNAPSHOT/api/guests/${currentEditId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updatedGuest)
                });

                if (response.ok) {
                    closeModal();
                    loadAllGuests();
                    alert('Гостень обновлена');
                }
            } catch (error) {
                console.error('Ошибка:', error);
            }
        });

        // Закрыть модальное окно
        function closeModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        // Удалить гостя
        async function deleteGuest(guestId) {
            if (!confirm('Өшіруге сінде сенісіңіз бе?')) return;

            try {
                const response = await fetch(`/Nazym_kyzuzatu-1.0-SNAPSHOT/api/guests/${guestId}`, {
                    method: 'DELETE'
                });

                if (response.ok || response.status === 204) {
                    loadAllGuests();
                    alert('Гостень өшірілді');
                }
            } catch (error) {
                console.error('Ошибка:', error);
            }
        }

        // Обновить статистику
        async function updateStatistics() {
            try {
                const response = await fetch('/Nazym_kyzuzatu-1.0-SNAPSHOT/api/guests/stats');
                const stats = await response.json();

                document.getElementById('totalGuests').textContent = stats.total || 0;
                document.getElementById('confirmedGuests').textContent = stats.confirmed || 0;
                document.getElementById('declinedGuests').textContent = stats.declined || 0;
                document.getElementById('pendingGuests').textContent = stats.pending || 0;
                document.getElementById('totalCount').textContent = stats.totalGuests || 0;
            } catch (error) {
                console.error('Ошибка:', error);
            }
        }

        // Экспортировать в CSV
        function exportToCSV() {
            const table = document.getElementById('guestsTable');
            let csv = 'Аты,Қонақ саны,Жұбайы,Статусы,Уақыты\n';

            document.querySelectorAll('#guestsList tr').forEach(row => {
                const cells = row.querySelectorAll('td');
                const name = cells[1].textContent;
                const count = cells[2].textContent;
                const spouse = cells[3].textContent;
                const status = cells[4].textContent.trim();
                const time = cells[5].textContent;

                csv += `"${name}","${count}","${spouse}","${status}","${time}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'guests_' + new Date().toISOString().split('T')[0] + '.csv';
            link.click();
        }

        // Печать списка
        function printList() {
            window.print();
        }

        // Обновить данные
        function refreshData() {
            if (currentFilter === 'all') {
                loadAllGuests();
            }
        }

        // Закрыть модальное окно при клике вне его
        window.onclick = function(event) {
            const modal = document.getElementById('editModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }
    </script>
</body>
</html>
